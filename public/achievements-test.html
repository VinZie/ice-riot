<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Challenge lab</title>
<link rel="icon" href="data:,">
<style>
  /* Lab chrome only. The module's own CSS must look right without style.css, so the design tokens
     are deliberately NOT defined here: achievements.js falls back to its built-in values. */
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: #0A0F1C; color: #E8EDF5; padding: 20px 16px 40px;
    font: 13px/18px Bahnschrift, "DIN Alternate", "Segoe UI", sans-serif;
  }
  h1 { margin: 0 0 4px; font-size: 22px; line-height: 26px; font-weight: 700; }
  .sub { color: #A1ACC0; margin: 0 0 14px; max-width: 900px; }
  .sub code { font-family: "Cascadia Mono", ui-monospace, Consolas, monospace; font-size: 12px; color: #E8EDF5; }
  .status { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .pill { background: #111829; border: 1px solid #253049; border-radius: 6px; padding: 4px 10px; color: #A1ACC0; font-size: 12px; }
  .pill b { color: #E8EDF5; font-weight: 400; }
  .wrap { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; max-width: 1240px; }
  @media (max-width: 860px) { .wrap { grid-template-columns: minmax(0, 1fr); } }
  .group { background: #111829; border: 1px solid #253049; border-radius: 10px; padding: 12px 14px 14px; margin-bottom: 12px; }
  .group h2 { margin: 0 0 10px; font-size: 12px; line-height: 14px; font-weight: 400; color: #A1ACC0; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  button { font: inherit; font-size: 13px; color: #E8EDF5; background: transparent; border: 1px solid #34425F;
           border-radius: 10px; padding: 7px 12px; cursor: pointer; }
  button:hover { background: #172034; }
  button:focus { outline: none; }
  button:focus-visible { outline: 2px solid #E8EDF5; outline-offset: 2px; }
  button.primary { background: #DCEAF6; color: #0A0F1C; border-color: #DCEAF6; }
  button.primary:hover { background: #c9dcec; }
  .log { background: #111829; border: 1px solid #253049; border-radius: 10px; padding: 10px 12px; height: 340px; overflow-y: auto;
         font: 12px/17px "Cascadia Mono", ui-monospace, Consolas, monospace; color: #A1ACC0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .log .u { color: #E8EDF5; }
  .mini { margin-top: 12px; font-size: 12px; color: #A1ACC0; }
  .mini b { color: #E8EDF5; font-weight: 400; }
  /* Lobby mock for ?auto=view: the main region right of the 336px rail, below the 72px top bar. */
  .lobby { position: fixed; inset: 0; background: #0A0F1C; z-index: 10; }
  .lobby .rail { position: absolute; left: 0; top: 0; bottom: 0; width: 336px; background: #111829; box-shadow: inset -1px 0 0 #253049; }
  .lobby .bar { position: absolute; left: 336px; right: 0; top: 0; height: 72px; display: flex; align-items: center; gap: 4px; padding: 0 32px; color: #A1ACC0; }
  .lobby .bar span { padding: 8px 12px; border-radius: 10px; }
  .lobby .bar span.on { background: #1E2940; color: #E8EDF5; }
  .lobby .main { position: absolute; left: 368px; top: 96px; right: 32px; bottom: 28px; }
</style>
</head>
<body>
<h1>Challenge lab</h1>
<p class="sub">Feeds synthetic Snapshot states and events into <code>achievements.js</code> (local player = client 1). Progress is stored under a lab-only key. <code>?auto=toast</code> · <code>?auto=panel</code> · <code>?auto=view</code> · <code>&amp;toastMs=</code></p>
<div class="status" id="status"></div>
<div class="wrap">
  <div id="groups"></div>
  <div>
    <div class="log" id="log"></div>
    <div class="mini" id="mini"></div>
  </div>
</div>

<script type="module">
import { createAchievements } from './achievements.js';
import { PHASE, EVENT, TICK_RATE } from '../shared/constants.js';

const params = new URLSearchParams(location.search);
const KEY = 'iceRiot.achievements.lab';
const ME = 1;
const OTHER = 2;
const $ = (id) => document.getElementById(id);
let fakeNow = null;                         // lab clock override (night shift, dated unlocks)
const clock = () => fakeNow ?? Date.now();

function log(msg, cls = '') {
  const el = $('log');
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = msg;
  el.appendChild(line);
  while (el.childNodes.length > 200) el.firstChild.remove();
  el.scrollTop = el.scrollHeight;
}

function makeState() {
  return {
    tick: 0, ph: PHASE.FACEOFF, phT: 1.6, per: 1, clk: 120, sc: [0, 0], teams: [0, 1],
    p: Array.from({ length: 8 }, (_, i) => ({
      id: i, tm: i >> 2, g: (i & 3) === 3 ? 1 : 0, x: i >> 2 ? 10 : -10, y: 0, z: 0, vx: 0, vz: 0,
      f: 0, s: 0, sT: 0, tb: 1, fire: 0, ch: 0, c: 0, n: 10 + i,
    })),
    k: { x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, o: -1 }, gl: [],
  };
}

// A tiny scripted "client": owns a fake state and pushes it + events through ach.handle().
function makeHarness(ach, quiet = false) {
  const H = {
    st: makeState(), game: 1,
    feed(events = [], ticks = 2) {
      H.st.tick += ticks;
      if (!quiet) for (const e of events) if (e.type !== EVENT.FACEOFF) log(`  ${e.type} ${JSON.stringify({ ...e, type: undefined })}`);
      ach.handle(events, structuredClone(H.st), { myId: ME });
      if (!quiet) renderStatus();
    },
    me() { return H.st.p.findIndex((p) => p.c === ME); },
    myTeam() { const m = H.me(); return m < 0 ? 0 : m >> 2; },
    mate() { const t = H.myTeam(), m = H.me() & 3; return t * 4 + ((m + 1) % 3); },
    opp() { return H.myTeam() ? 0 : 4; },
    advance(s) { H.feed([], Math.round(s * TICK_RATE)); },
    drop() { H.st.ph = PHASE.PLAY; H.feed([{ type: EVENT.FACEOFF, x: 0, z: 0 }]); },
    shot(kind = 'wrist', power = 0.6, by = H.me()) { H.st.ph = PHASE.PLAY; H.feed([{ type: EVENT.SHOT, by, power, kind }]); },
    goal({ scorer = H.me(), assist = -1, oneTimer = false } = {}) {
      const team = scorer >> 2;
      H.st.sc[team]++;
      H.st.ph = PHASE.GOAL;
      H.feed([{ type: EVENT.GOAL, team, scorer, assist, oneTimer, x: team ? -26.7 : 26.7, z: 0 }]);
      H.st.ph = PHASE.PLAY; H.st.clk = Math.max(20, H.st.clk); H.advance(4);
    },
    hit(big) { H.feed([{ type: EVENT.HIT, by: H.me(), target: H.opp() + 1, power: big ? 1 : 0.4, big: big ? 1 : 0, x: 3, z: 12 }]); },
    endGame(ot = false) {
      if (ot) { H.st.per = 4; H.feed([{ type: EVENT.PERIOD, period: 4 }]); }
      H.advance(60);                        // games are at least a few minutes long
      H.st.ph = PHASE.GAME_OVER;
      H.feed([{ type: EVENT.FINAL, score: [...H.st.sc] }]);
      if (!quiet) log(`FINAL ${H.st.sc.join('-')} (you: ${H.me() < 0 ? 'in the stands' : H.myTeam() ? 'away' : 'home'})`);
      H.newGame();
    },
    play(mine, theirs, ot = false) {
      for (let i = 0; i < theirs; i++) H.goal({ scorer: H.opp() });
      for (let i = 0; i < mine; i++) H.goal();
      H.endGame(ot);
    },
    newGame() {
      const c = H.me();
      H.st = makeState(); H.game++;
      if (c >= 0) H.st.p[c].c = ME;
      H.feed([]); if (!quiet) log(`-- new game #${H.game}`);
    },
  };
  H.st.p[0].c = ME;
  H.st.p[5].c = OTHER;
  return H;
}

const SCEN = {
  'Wrist goal': (H) => { H.shot(); H.goal(); },
  'One-timer goal': (H) => { H.feed([{ type: EVENT.PASS, by: H.mate(), to: H.me() }]); H.shot('onetimer', 1); H.goal({ oneTimer: true, assist: H.mate() }); },
  'Long slapshot goal': (H) => { H.st.p[H.me()].x = 0; H.shot('slap', 0.85); H.goal(); },
  'Assist a one-timer': (H) => { H.feed([{ type: EVENT.PASS, by: H.me(), to: H.mate() }]); H.goal({ scorer: H.mate(), assist: H.me(), oneTimer: true }); },
  'Goal off the drop': (H) => { H.drop(); H.advance(4); H.goal(); },
  'Goal at the horn': (H) => { H.st.ph = PHASE.PLAY; H.st.clk = 2.4; H.feed([]); H.goal(); },
  'Hat trick': (H) => { H.goal(); H.goal(); H.goal(); },
  'Big hit': (H) => H.hit(true),
  'Shatter glass': (H) => { H.hit(true); H.feed([{ type: EVENT.GLASS, panel: 6, by: H.me(), target: H.opp() + 1, x: 3, z: 13 }]); },
  'Steal': (H) => H.feed([{ type: EVENT.STEAL, by: H.me(), from: H.opp() }]),
  'Deke': (H) => H.feed([{ type: EVENT.DEKE, by: H.me() }]),
  'Full slapshot': (H) => H.shot('slap', 1),
  'Catch fire': (H) => { H.st.p[H.me()].fire = 1; H.feed([{ type: EVENT.FIRE, player: H.me(), on: 1 }]); },
  'Fire goes out': (H) => { H.st.p[H.me()].fire = 0; H.feed([{ type: EVENT.FIRE, player: H.me(), on: 0 }]); },
  'Win 2-1': (H) => H.play(2, 1),
  'OT win': (H) => H.play(1, 0, true),
  'Shutout 1-0': (H) => H.play(1, 0),
  'Blowout 5-0': (H) => H.play(5, 0),
  'Comeback 3-2': (H) => H.play(3, 2),
  'Loss 0-1': (H) => H.play(0, 1),
  '+25 hits': (H) => { for (let i = 0; i < 25; i++) H.hit(i % 4 === 0); },
  '+5 goals': (H) => { for (let i = 0; i < 5; i++) H.goal(); },
  '+10 games': (H) => { for (let i = 0; i < 10; i++) H.play(0, 1); },
  // ---- secrets
  'Win a fight': (H) => H.feed([{ type: 'fightEnd', winner: H.me(), loser: H.opp() + 1, how: 'ko' }]),
  'Lose a fight': (H) => H.feed([{ type: 'fightEnd', winner: H.opp() + 1, loser: H.me(), how: 'time' }]),
  'Ring the post': (H) => { H.shot('wrist', 0.8); H.advance(0.3); H.feed([{ type: EVENT.POST, x: 26.6, z: 0.9 }]); },
  'Glass, then score': (H) => { SCEN['Shatter glass'](H); H.advance(6); H.goal(); },
  'Night game (02:30)': (H) => {
    const d = new Date(); d.setHours(2, 30, 0, 0);
    fakeNow = d.getTime();
    try { H.play(1, 2); } finally { fakeNow = null; }
  },
  'Watch a whole game': (H) => {
    const m = H.me();
    if (m >= 0) H.st.p[m].c = 0;
    H.advance(0.5);
    H.newGame();                            // next game, from the stands
    H.goal({ scorer: 0 }); H.goal({ scorer: 4 });
    H.endGame();
    H.st.p[m >= 0 ? m : 0].c = ME; H.advance(0.5);
    log('back on the ice');
  },
  'AI events (no credit)': (H) => {
    const ai = H.mate();
    H.feed([{ type: EVENT.HIT, by: ai, target: 5, big: 1 }, { type: EVENT.STEAL, by: ai, from: 5 }, { type: EVENT.DEKE, by: 5 }]);
    H.goal({ scorer: ai });
  },
  'Switch skater (SWITCH)': (H) => {
    const from = H.me(), to = H.mate();
    H.st.p[from].c = 0; H.st.p[to].c = ME;
    H.feed([{ type: EVENT.SWITCH, client: ME, from, to }]);
    log(`now controlling #${to}`);
  },
  'Change team (no SWITCH)': (H) => {
    const from = H.me(), to = from >> 2 ? 0 : 4;
    H.st.p[from].c = 0; H.st.p[to].c = ME;
    H.advance(0.05); H.advance(0.5);
    log(`now on the ${to ? 'away' : 'home'} team (#${to})`);
  },
  'Spectate / rejoin': (H) => {
    const m = H.me();
    if (m >= 0) { H.st.p[m].c = 0; H._last = m; log('spectating'); }
    else { H.st.p[H._last ?? 0].c = ME; log('rejoined'); }
    H.advance(0.5);
  },
  'New game': (H) => H.newGame(),
};
SCEN['Unlock everything'] = (H) => {
  for (const k of ['Wrist goal', 'One-timer goal', 'Long slapshot goal', 'Assist a one-timer', 'Goal off the drop', 'Goal at the horn',
    'Catch fire', 'Hat trick', 'Full slapshot', 'Big hit']) SCEN[k](H);
  for (let i = 0; i < 3; i++) SCEN['Shatter glass'](H);
  for (let i = 0; i < 5; i++) { SCEN['Steal'](H); SCEN['Deke'](H); SCEN['Big hit'](H); }
  for (let i = 0; i < 3; i++) SCEN['Assist a one-timer'](H);
  SCEN['+25 hits'](H); SCEN['+25 hits'](H); SCEN['+25 hits'](H); SCEN['+25 hits'](H);
  SCEN['+5 goals'](H); SCEN['+5 goals'](H); SCEN['+5 goals'](H); SCEN['+5 goals'](H);
  SCEN['Comeback 3-2'](H); SCEN['OT win'](H); SCEN['Blowout 5-0'](H); SCEN['+10 games'](H);
};
SCEN['Find every secret'] = (H) => {
  SCEN['Win a fight'](H);
  for (let i = 0; i < 3; i++) SCEN['Ring the post'](H);
  SCEN['Glass, then score'](H);
  SCEN['Night game (02:30)'](H);
  SCEN['Watch a whole game'](H);
};

const GROUPS = [
  ['Scoring', ['Wrist goal', 'One-timer goal', 'Long slapshot goal', 'Assist a one-timer', 'Goal off the drop', 'Goal at the horn', 'Hat trick']],
  ['Physical and skill', ['Big hit', 'Shatter glass', 'Steal', 'Deke', 'Full slapshot', 'Catch fire', 'Fire goes out']],
  ['Results', ['Win 2-1', 'OT win', 'Shutout 1-0', 'Blowout 5-0', 'Comeback 3-2', 'Loss 0-1']],
  ['Career grind', ['+25 hits', '+5 goals', '+10 games']],
  ['Secrets', ['Win a fight', 'Lose a fight', 'Ring the post', 'Glass, then score', 'Night game (02:30)', 'Watch a whole game']],
  ['Control and attribution', ['AI events (no credit)', 'Switch skater (SWITCH)', 'Change team (no SWITCH)', 'Spectate / rejoin', 'New game']],
];

let ach, H, viewHost = null;
function boot(toastMs, container = document.body) {
  if (ach) ach.dispose();
  ach = createAchievements({
    container, storageKey: KEY, toastMs, now: clock,
    onUnlock: (c) => log(`Unlocked  ${c.title}  (tier ${c.tier}${c.secret ? ', secret' : ''})`, 'u'),
  });
  ach.onProgress((p) => log(`progress ${p.done}/${p.total}, secrets ${p.secretsDone}/${p.secretsTotal}`));
  H = makeHarness(ach);
  H.feed([]);
  if (viewHost) ach.mountView(viewHost);
}

function renderStatus() {
  if (!H || !ach) return;
  const me = H.me();
  const l = ach.list();
  const p = ach.progress();
  $('status').innerHTML =
    `<span class="pill">Game <b>#${H.game}</b></span>`
    + `<span class="pill">Score <b>${H.st.sc[0]} - ${H.st.sc[1]}</b></span>`
    + `<span class="pill">You <b>${me < 0 ? 'in the stands' : `#${me} ${me >> 2 ? 'away' : 'home'}`}</b></span>`
    + `<span class="pill">Tick <b>${H.st.tick}</b></span>`
    + `<span class="pill">Cleared <b>${p.done} of ${p.total}</b></span>`
    + `<span class="pill">Secrets <b>${p.secretsDone} of ${p.secretsTotal}</b></span>`;
  const near = l.filter((c) => !c.unlocked && c.progress > 0).map((c) => `${c.title} ${c.progress}/${c.goal}`);
  $('mini').innerHTML = near.length ? `<b>In progress:</b> ${near.join(' · ')}` : '';
}

function showLobbyView() {
  if (document.querySelector('.lobby')) return;
  const lobby = document.createElement('div');
  lobby.className = 'lobby';
  lobby.innerHTML = '<div class="rail"></div><div class="bar"><span>Match</span><span>Leaderboard</span><span class="on">Challenges</span>'
    + '<span style="margin-left:auto" data-close>Back to the lab</span></div><div class="main" id="ir-view-challenges"></div>';
  document.body.appendChild(lobby);
  lobby.querySelector('[data-close]').addEventListener('click', () => { lobby.remove(); viewHost = null; });
  viewHost = lobby.querySelector('#ir-view-challenges');
  ach.mountView(viewHost);
}

function buildButtons() {
  const host = $('groups');
  const mk = (label, fn, cls = '') => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = label; if (cls) b.className = cls;
    b.addEventListener('click', fn);
    return b;
  };
  for (const [title, names] of GROUPS) {
    const g = document.createElement('div'); g.className = 'group';
    g.innerHTML = `<h2>${title}</h2>`;
    const row = document.createElement('div'); row.className = 'btns';
    for (const n of names) row.appendChild(mk(n, () => { log(`> ${n}`); SCEN[n](H); }));
    g.appendChild(row); host.appendChild(g);
  }
  const g = document.createElement('div'); g.className = 'group';
  g.innerHTML = '<h2>Views</h2>';
  const row = document.createElement('div'); row.className = 'btns';
  row.appendChild(mk('Open sheet', () => ach.openPanel(), 'primary'));
  row.appendChild(mk('Lobby view', showLobbyView));
  row.appendChild(mk('Unlock everything', () => { log('> Unlock everything'); SCEN['Unlock everything'](H); }));
  row.appendChild(mk('Find every secret', () => { log('> Find every secret'); SCEN['Find every secret'](H); }));
  row.appendChild(mk('Reset progress', () => { ach.reset(); log('progress reset'); renderStatus(); }));
  row.appendChild(mk('Print list()', () => console.table(ach.list())));
  g.appendChild(row); host.appendChild(g);
}

// Progress like the "Lobby · challenges view" frame: 14 of 25, a few in progress, 2 secrets,
// dated unlocks, built by a headless instance on the same key (no toasts, no New chips).
function seedDesignProgress() {
  const silent = createAchievements({ container: null, storageKey: KEY, now: clock });
  silent.reset();
  const S = makeHarness(silent, true);
  const day = (m, d) => new Date(new Date().getFullYear(), m - 1, d, 20, 0).getTime();
  // each block is its own game, so per-game challenges only clear where intended
  const game = (t, fn) => { fakeNow = t; S.advance(1); S.newGame(); fn(); };
  game(day(10, 30), () => { S.shot(); S.goal(); S.hit(true); S.shot('slap', 1); });   // lamp lighter, bone rattler, full wind-up
  game(day(10, 31), () => S.play(2, 1));                                          // victory lap
  game(day(11, 1), () => SCEN['One-timer goal'](S));                              // no hesitation
  game(day(11, 2), () => { SCEN['Shatter glass'](S); SCEN['Catch fire'](S); });   // pane in the glass, ignition
  game(day(11, 6), () => SCEN['Long slapshot goal'](S));                          // long bomb
  game(day(11, 8), () => { for (let i = 0; i < 10; i++) S.play(0, 1); });         // rink rat
  game(day(11, 9), () => { for (let i = 0; i < 3; i++) SCEN['Steal'](S); SCEN['Catch fire'](S); S.goal(); });   // pickpocket, hot hands
  game(day(11, 10), () => SCEN['Win a fight'](S));                                // heavyweight (secret)
  game(day(11, 12), () => { for (let i = 0; i < 100; i++) S.hit(false); });       // human wrecking ball
  game(day(11, 13), () => { for (let i = 0; i < 3; i++) SCEN['Ring the post'](S); });   // bar down (secret)
  for (let g = 0; g < 12; g++) game(day(11, 15), () => { S.goal(); S.goal(); });  // quarter century, never 3 in a game
  // in progress, no unlocks: spin cycle 4/5, demolition shift 3/5, sauce boss 2/3, three-alarm 2/3
  game(null, () => {
    for (let i = 0; i < 4; i++) SCEN['Deke'](S);
    for (let i = 0; i < 3; i++) S.hit(true);
    for (let i = 0; i < 2; i++) S.goal({ scorer: S.mate(), assist: S.me() });
    S.goal(); S.goal();
  });
  fakeNow = null;
  silent.dispose();
}

buildButtons();
window.__lab = { ach: () => ach, harness: () => H, scenario: (n) => SCEN[n](H), showLobbyView };   // for automation
const auto = params.get('auto');
const tms = Number(params.get('toastMs'));
if (auto === 'toast') {
  boot(tms || 600000);
  ach.reset();
  SCEN['Wrist goal'](H);                  // tier 1: Lamp lighter
  SCEN['Long slapshot goal'](H);          // tier 2: Long bomb
  SCEN['Goal at the horn'](H);            // tier 3: Beat the horn (+ Three-alarm queued behind it)
  SCEN['Win a fight'](H);                 // secret: Heavyweight (queued)
} else if (auto === 'secret-toast') {
  boot(tms || 600000);
  ach.reset();
  SCEN['Win a fight'](H);
} else if (auto === 'panel') {
  seedDesignProgress();
  boot(3600);
  ach.openPanel();
} else if (auto === 'view') {
  seedDesignProgress();
  boot(tms || 3600, null);                // no container: no toasts over the mock
  fakeNow = Date.now() - 12 * 60e3;       // one unlock this session, 12 minutes ago: "New"
  H.play(2, 1, true);                     // overtime outlaw (2-1: no shutout)
  fakeNow = null;
  showLobbyView();
  const f = params.get('filter');
  if (f) viewHost.querySelector(`[data-filter="${f}"]`)?.click();
  if (params.get('scroll')) viewHost.querySelector('.ir-ach-scroll').scrollTop = Number(params.get('scroll'));
} else {
  boot(tms || 3600);
}
renderStatus();
</script>
</body>
</html>
