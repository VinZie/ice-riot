<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ICE RIOT - chat test</title>
<!--
  Standalone harness for public/chat.js. No server needed beyond static files: the "server" below
  is a fake inline echo (it mirrors server/chat.js rules: sanitize, 120-char cap, token bucket
  burst 5 / refill 1 per s, emote id check). Bots chat from home / away / spectator.
  URL params: ?mode=game  start in-game   &open=1  open the in-game input   &bots=0  no bot chatter
-->
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #070a16; color: #dfe7f5;
    font-family: "Bahnschrift SemiCondensed", Bahnschrift, "Roboto Condensed", "Arial Narrow", Arial, sans-serif;
    overflow: hidden;
  }
  .bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 60; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    padding: 8px 12px; background: rgba(4, 6, 14, .85); border-bottom: 1px solid #1d2a44; font-size: 13px;
  }
  .bar b { color: #ffd23f; letter-spacing: .12em; font-style: italic; margin-right: 6px; }
  .bar button {
    font: inherit; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #cfe9ff;
    background: #101a30; border: 1px solid #2a3d63; border-radius: 3px; padding: 4px 9px; cursor: pointer;
  }
  .bar button.on { background: #2de2ff; color: #06101e; border-color: #2de2ff; }
  .bar .status { margin-left: auto; color: #8fa3c0; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar .status em { color: #ffd23f; font-style: normal; }

  /* fake lobby */
  .lobby {
    position: absolute; inset: 52px 0 0 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 380px);
    gap: 16px; padding: 16px; box-sizing: border-box;
    background: radial-gradient(ellipse at 30% 20%, #16244a 0%, #070a16 70%);
  }
  .roster { border: 2px solid #22345a; border-radius: 4px; padding: 14px 16px; background: rgba(8, 12, 28, .6); }
  .roster h2 { margin: 0 0 10px; font-style: italic; letter-spacing: .14em; color: #ffd23f; font-size: 22px; }
  .roster .team { margin: 12px 0 4px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
  .roster .p { padding: 3px 8px; margin: 2px 0; background: rgba(255, 255, 255, .04); border-radius: 3px; font-size: 14px; }
  .chat-slot { min-height: 0; height: 100%; }
  @media (max-width: 720px) {
    .lobby { grid-template-columns: 1fr; grid-template-rows: auto minmax(260px, 1fr); }
    .roster { display: none; }
  }

  /* fake rink */
  .rink { position: absolute; inset: 0; display: none; background: #0b1530; }
  .rink .ice {
    position: absolute; left: 6%; right: 6%; top: 18%; bottom: 10%; border-radius: 90px;
    background:
      linear-gradient(90deg, transparent 49.6%, #d4283a 49.6%, #d4283a 50.4%, transparent 50.4%),
      linear-gradient(90deg, transparent 36%, #2b56c9 36%, #2b56c9 37.2%, transparent 37.2%,
                              transparent 62.8%, #2b56c9 62.8%, #2b56c9 64%, transparent 64%),
      radial-gradient(ellipse at 50% 45%, #ffffff 0%, #e8f1fb 60%, #cfdbea 100%);
    box-shadow: 0 0 0 10px #f4f6fa, 0 0 0 14px #1d2a44, 0 30px 80px rgba(0, 0, 0, .6);
  }
  .rink .hud {
    position: absolute; top: 60px; left: 50%; transform: translateX(-50%); display: flex; gap: 14px; align-items: center;
    background: rgba(5, 8, 20, .85); border: 2px solid #2de2ff; border-radius: 4px; padding: 4px 14px;
    font-weight: 800; font-style: italic; letter-spacing: .08em; font-size: 20px;
  }
  .rink .dot { position: absolute; width: 22px; height: 22px; border-radius: 50%; border: 3px solid #111; }
  body.game .lobby { display: none; }
  body.game .rink { display: block; }
</style>
</head>
<body>
  <div class="bar">
    <b>CHAT TEST</b>
    <button id="mLobby">Lobby</button>
    <button id="mGame">In-game</button>
    <button id="bSay">Bot says</button>
    <button id="bEmote">Bot emote</button>
    <button id="bSpam">Spam x8</button>
    <button id="bColors">Swap colors</button>
    <span class="status">typing: <em id="typing">no</em> &middot; game keys seen: <em id="keys">-</em></span>
  </div>

  <div class="lobby">
    <div class="roster">
      <h2>LOBBY</h2>
      <div class="team" style="color:#ff6a13">Home</div>
      <div class="p">You</div><div class="p">Blizz</div>
      <div class="team" style="color:#7fd3ff">Away</div>
      <div class="p">Rook</div><div class="p">(AI)</div>
      <div class="team" style="color:#9aa3ad">Spectators</div>
      <div class="p">Sideline Sam</div>
    </div>
    <div class="chat-slot" id="chatSlot"></div>
  </div>

  <div class="rink" id="rink">
    <div class="ice">
      <div class="dot" style="left:30%;top:40%;background:#ff6a13"></div>
      <div class="dot" style="left:44%;top:62%;background:#ff6a13"></div>
      <div class="dot" style="left:58%;top:35%;background:#7fd3ff"></div>
      <div class="dot" style="left:66%;top:55%;background:#7fd3ff"></div>
    </div>
    <div class="hud"><span style="color:#ff6a13">HAM 2</span><span style="color:#8fa3c0">1st 1:42</span><span style="color:#7fd3ff">3 FWV</span></div>
  </div>

<script type="module">
import { createChat, QUICK_CHAT, CHAT_MAX_LEN } from './chat.js';

const params = new URLSearchParams(location.search);
const MY_ID = 1;
const PEOPLE = {
  1: { id: 1, name: 'You', team: 0 },
  2: { id: 2, name: 'Blizz', team: 0 },
  3: { id: 3, name: 'Rook', team: 1 },
  4: { id: 4, name: 'Sideline Sam', team: -1 },
};
const COLOR_SETS = [[0xff6a13, 0x7fd3ff], [0x39ff14, 0xffd23f], [0x14213d, 0x4b1d80] /* dark: gets lifted */];
let colorSet = 0;

// ---- fake server (mirrors server/chat.js rules) --------------------------------------------
const buckets = new Map();
function take(id, now) {
  let b = buckets.get(id);
  if (!b) buckets.set(id, (b = { tokens: 5, last: now }));
  b.tokens = Math.min(5, b.tokens + Math.max(0, now - b.last) / 1000);
  b.last = now;
  if (b.tokens < 1) return false;
  b.tokens -= 1;
  return true;
}
function sanitize(s) {
  if (typeof s !== 'string') return '';
  s = s.replace(/[\t\n\v\f\r\u0085\u2028\u2029]/g, ' ')
       .replace(/[\u0000-\u001f\u007f-\u009f\u200b-\u200f\u202a-\u202e\u2060-\u206f\ufeff]/g, '')
       .replace(/\s+/g, ' ').trim();
  return Array.from(s).slice(0, CHAT_MAX_LEN).join('').trimEnd();
}
function fakeServer(client, msg) {
  let text, emote = null;
  if (msg.t === 'chat') { text = sanitize(msg.text); if (!text) return; }
  else if (msg.t === 'emote') {
    if (!Number.isInteger(msg.id) || msg.id < 0 || msg.id >= QUICK_CHAT.length) return;
    emote = msg.id; text = QUICK_CHAT[emote];
  } else return;
  const now = Date.now();
  if (!take(client.id, now)) {
    if (client.id === MY_ID) chat.receive({ t: 'chat', from: 0, name: '', team: -1, text: 'Slow down - too many chat messages', emote: null, ts: now });
    return;
  }
  const out = { t: 'chat', from: client.id, name: client.name, team: client.team, text, emote, ts: now };
  setTimeout(() => chat.receive(out), 40); // fake network latency
}

// ---- chat ---------------------------------------------------------------------------------
const chat = createChat(document.getElementById('chatSlot'), {
  send: (m) => fakeServer(PEOPLE[MY_ID], m),
  myId: MY_ID,
  gameContainer: document.body,
  onTyping: (on) => { document.getElementById('typing').textContent = on ? 'YES' : 'no'; },
});
chat.setTeamColors(COLOR_SETS[0]);
window.chat = chat;

// Shows that keys typed into the chat never reach window-level game handlers.
const GAME_KEYS = new Set(['KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyJ', 'KeyK', 'KeyL', 'Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);
window.addEventListener('keydown', (e) => {
  if (!GAME_KEYS.has(e.code) || chat.isTyping()) return;
  const el = document.getElementById('keys');
  el.textContent = (e.code.replace('Key', '') + ' ' + el.textContent).slice(0, 24);
});

function setMode(game) {
  document.body.classList.toggle('game', game);
  document.getElementById('mLobby').classList.toggle('on', !game);
  document.getElementById('mGame').classList.toggle('on', game);
  chat.setInGame(game);
}
document.getElementById('mLobby').onclick = () => setMode(false);
document.getElementById('mGame').onclick = () => setMode(true);

const LINES = [
  'anyone up for a 3v3?', 'that glass did not survive', 'switching to defense', 'who keeps icing it lol',
  'one-timer from the slot, so clean', 'my goalie is asleep', 'turbo is everything', 'brb',
];
let lineIdx = 0;
const bot = () => PEOPLE[2 + Math.floor(Math.random() * 3)];
function botSay() { fakeServer(bot(), { t: 'chat', text: LINES[lineIdx++ % LINES.length] }); }
function botEmote() { fakeServer(bot(), { t: 'emote', id: Math.floor(Math.random() * QUICK_CHAT.length) }); }
document.getElementById('bSay').onclick = botSay;
document.getElementById('bEmote').onclick = botEmote;
document.getElementById('bSpam').onclick = () => { for (let i = 0; i < 8; i++) fakeServer(PEOPLE[MY_ID], { t: 'chat', text: `spam ${i + 1}` }); };
document.getElementById('bColors').onclick = () => { colorSet = (colorSet + 1) % COLOR_SETS.length; chat.setTeamColors(COLOR_SETS[colorSet]); };

// ---- seed ---------------------------------------------------------------------------------
const game = params.get('mode') === 'game';
setMode(game);
const t0 = Date.now() - 60000;
const seed = [
  [2, 'anyone up for a 3v3?'],
  [3, '<b>this is not bold</b> & <img src=x onerror=alert(1)> stays literal'],
  [4, 'watching from the cheap seats'],
  [1, 'ready when you are'],
  [3, null, 4],
  [2, 'that last slapshot went through the glass and I am still not over it, absolutely ridiculous power'],
  [2, null, 7],
  [1, null, 1],
];
seed.forEach(([id, text, emote], i) => {
  const p = PEOPLE[id];
  chat.receive({ t: 'chat', from: id, name: p.name, team: p.team, text: text ?? QUICK_CHAT[emote], emote: emote ?? null, ts: t0 + i * 7000 });
});
// A replayed history message (hist) is de-duplicated if it was already shown:
chat.receive({ t: 'chat', from: 2, name: 'Blizz', team: 0, text: 'anyone up for a 3v3?', emote: null, ts: t0, hist: true });
if (game && params.get('open') === '1') chat.open();
if (params.get('bots') !== '0') setInterval(() => (Math.random() < 0.6 ? botSay() : botEmote()), 4500);
</script>
</body>
</html>
