  <script>
    // Boot watchdog: if the app modules fail to load (syntax error, 404, old browser), show a
    // readable message instead of a blank page.
    (function () {
      var errs = [];
      window.addEventListener('error', function (e) {
        errs.push((e.message || 'Error') + (e.filename ? ' (' + e.filename.replace(location.origin, '') + ':' + e.lineno + ')' : ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        errs.push('Unhandled: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason));
      });
      setTimeout(function () {
        if (window.__iceRiotBooted) return;
        var el = document.getElementById('fatal');
        el.querySelector('.fatal-title').textContent = "The game couldn't start";
        el.querySelector('.fatal-detail').textContent = (errs.join('\n') || 'The game scripts did not load. Check that the server is running and that your browser supports ES modules.');
        el.hidden = false;
      }, 6000);
    })();
  </script>
