<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060a14">
  <meta name="description" content="ICE RIOT - original 3-on-3 arcade hockey for you and your friends">
  <title>ICE RIOT</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23060a14'/%3E%3Cpath d='M10 44 L30 10 L38 10 L22 38 L54 38 L50 46 Z' fill='%2319e6ff'/%3E%3Cpath d='M34 54 L44 30 L52 30 L42 54 Z' fill='%23ff2e63'/%3E%3Cellipse cx='22' cy='52' rx='9' ry='4' fill='%23ffe14d'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <script type="importmap">{"imports":{"three":"/vendor/three.module.min.js"}}</script>
</head>
<body>
  <canvas id="game" aria-label="ICE RIOT rink"></canvas>
  <div id="ui"></div>

  <div id="fatal" hidden>
    <div class="fatal-card">
      <div class="fatal-logo">ICE <b>RIOT</b></div>
      <div class="fatal-title">Something broke on the way to the rink</div>
      <pre class="fatal-detail"></pre>
      <button type="button" onclick="location.reload()">RELOAD</button>
    </div>
  </div>
  <noscript><div class="noscript">ICE RIOT needs JavaScript enabled.</div></noscript>

  <script>
    // Boot watchdog: if the app modules fail to load (syntax error, 404, old browser), show a
    // readable message instead of a blank page.
    (function () {
      var errs = [];
      window.addEventListener('error', function (e) {
        errs.push((e.message || 'Error') + (e.filename ? ' (' + e.filename.replace(location.origin, '') + ':' + e.lineno + ')' : ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        errs.push('Unhandled: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason));
      });
      setTimeout(function () {
        if (window.__iceRiotBooted) return;
        var el = document.getElementById('fatal');
        el.querySelector('.fatal-title').textContent = 'ICE RIOT failed to start';
        el.querySelector('.fatal-detail').textContent = (errs.join('\n') || 'The game scripts did not load. Check that the server is running and your browser supports ES modules.');
        el.hidden = false;
      }, 6000);
    })();
  </script>
  <script type="module" src="/main.js"></script>
</body>
</html>
