<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A0F1C">
<title>ICE RIOT - touch controls test</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--ground, #0A0F1C);
    color: var(--ink, #E8EDF5);
    font: 13px/18px var(--f-ui, Bahnschrift, "DIN Alternate", "Segoe UI", sans-serif);
  }
  /* A plain sheet of ice with the centre and blue lines, so the controls are judged over white ice. */
  #ice {
    position: fixed; inset: 0;
    background:
      linear-gradient(90deg, transparent calc(50% - 4px), #F0485A calc(50% - 4px), #F0485A calc(50% + 4px), transparent calc(50% + 4px)),
      linear-gradient(90deg, transparent calc(22% - 5px), #3D7FE0 calc(22% - 5px), #3D7FE0 calc(22% + 5px), transparent calc(22% + 5px)),
      linear-gradient(90deg, transparent calc(78% - 5px), #3D7FE0 calc(78% - 5px), #3D7FE0 calc(78% + 5px), transparent calc(78% + 5px)),
      #EEF2F6;
  }
  #panel {
    position: fixed; z-index: 60; left: 50%; transform: translateX(-50%);
    top: calc(env(safe-area-inset-top, 0px) + 64px);
    width: min(372px, calc(100vw - 32px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
    box-sizing: border-box; padding: 12px;
    background: var(--surface, #111829); border: 1px solid var(--hairline-strong, #34425F); border-radius: var(--r-lg, 16px);
  }
  .title { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .title b { font-size: 16px; line-height: 20px; }
  .title span { font-size: 12px; color: var(--ink-2, #A1ACC0); }
  .grid { display: grid; grid-template-columns: 168px 1fr; gap: 10px; align-items: center; }
  #rink { width: 168px; height: 73px; display: block; }
  #out { margin: 0; font: 12px/16px var(--f-mono, "Cascadia Mono", ui-monospace, Consolas, monospace); white-space: pre; color: var(--ink-2, #A1ACC0); }
  .bits { display: flex; gap: 6px; margin: 8px 0; }
  .bit { flex: 1; text-align: center; font-size: 12px; line-height: 14px; padding: 4px 0;
         border-radius: var(--r-sm, 6px); border: 1px solid var(--hairline, #253049); color: var(--ink-3, #6A7590); }
  .bit.on { color: var(--on-ice, #0A0F1C); border-color: var(--ice, #DCEAF6); background: var(--ice, #DCEAF6); }
  .row { display: flex; gap: 6px; align-items: center; }
  .row + .row { margin-top: 8px; }
  button.tg {
    flex: 1; font: inherit; font-size: 12px; color: var(--ink, #E8EDF5); background: transparent;
    border: 1px solid var(--hairline-strong, #34425F); border-radius: var(--r-md, 10px);
    padding: 7px 4px; touch-action: manipulation; cursor: pointer;
  }
  button.tg.on { background: var(--ice, #DCEAF6); border-color: var(--ice, #DCEAF6); color: var(--on-ice, #0A0F1C); }
  button.tg:focus-visible { outline: 2px solid var(--focus, #E8EDF5); outline-offset: 2px; }
  label { font-size: 12px; display: flex; align-items: center; gap: 6px; color: var(--ink-2, #A1ACC0); }
  input[type=range] { flex: 1; accent-color: var(--fire, #FF8A2A); min-width: 0; }
  .note { font-size: 12px; color: var(--ink-2, #A1ACC0); margin-top: 6px; }
  .note:empty { display: none; }
  body.shot #panel { display: none; }
  @media (orientation: portrait) {
    .grid { grid-template-columns: 1fr; }
    #rink { width: 100%; height: auto; aspect-ratio: 60 / 26; }
  }
</style>
</head>
<body>
<div id="ice"></div>
<div id="panel" data-ir-touch-allow>
  <div class="title"><b>Touch controls</b><span id="vp">test page</span></div>
  <div class="grid">
    <canvas id="rink"></canvas>
    <pre id="out">waiting…</pre>
  </div>
  <div class="bits">
    <div class="bit" data-bit="1">Shoot</div>
    <div class="bit" data-bit="2">Pass</div>
    <div class="bit" data-bit="4">Action</div>
    <div class="bit" data-bit="8">Turbo</div>
  </div>
  <div class="row">
    <button class="tg" id="puck">Has puck: no</button>
    <button class="tg" id="auto">Auto turbo: off</button>
    <button class="tg" id="vis">Hide</button>
  </div>
  <div class="row">
    <label>Charge <input id="charge" type="range" min="0" max="1" step="0.01" value="0"></label>
    <label><input id="simCharge" type="checkbox" checked> Simulate</label>
  </div>
  <div class="note" id="note"></div>
</div>

<script type="module">
import { BTN, RINK, clamp } from '/shared/constants.js';
import { createTouchControls, isTouchDevice } from '/touch.js';

const q = new URLSearchParams(location.search);
const force = q.get('force') === '1';
const demo = +(q.get('demo') || 0);
const $ = (id) => document.getElementById(id);
if (q.get('shot') === '1') document.body.classList.add('shot');

// ?puck=1 forces "has puck" (Shoot / Pass / Deke labels); demo=1 implies it.
let hasPuck = demo === 1 || q.get('puck') === '1';
let autoTurbo = q.get('auto') === '1' || demo === 2;
let visible = force || isTouchDevice();
let charge = 0;
let tc = null;

const fight = q.get('fight') === '1';   // ?fight=1: fight mini-game labels (Jab / Block / Haymaker / Dodge)
function build() {
  tc?.dispose();
  tc = createTouchControls(document.body, { autoTurbo, mouse: force, visible, hasPuck });
  if (fight) tc.setContext({ hasPuck, fight });
  tc.setCharge(charge);
}
build();

if (!visible) {
  $('note').textContent = 'Not detected as a touch device - add ?force=1 to show the controls (mouse works then). They also appear on the first touch.';
  addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'touch' && !visible) { visible = true; tc.setVisible(true); $('note').textContent = ''; syncUi(); }
  });
}

function syncUi() {
  $('puck').textContent = `Has puck: ${hasPuck ? 'yes' : 'no'}`;
  $('puck').classList.toggle('on', hasPuck);
  $('auto').textContent = `Auto turbo: ${autoTurbo ? 'on' : 'off'}`;
  $('auto').classList.toggle('on', autoTurbo);
  $('vis').textContent = visible ? 'Hide' : 'Show';
}
syncUi();

$('puck').onclick = () => { hasPuck = !hasPuck; tc.setContext({ hasPuck, fight }); syncUi(); };
$('auto').onclick = () => { autoTurbo = !autoTurbo; build(); syncUi(); }; // also exercises dispose()
$('vis').onclick = () => { visible = !visible; tc.setVisible(visible); syncUi(); };
$('charge').oninput = (e) => { $('simCharge').checked = false; charge = +e.target.value; tc.setCharge(charge); };

// ---- mini rink with a dot driven by the stick ----
const cv = $('rink'), g = cv.getContext('2d');
const dot = { x: 0, z: 0 }, trail = [];
function sizeCanvas() {
  const r = cv.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.max(1, Math.round(r.width * dpr)); cv.height = Math.max(1, Math.round(r.height * dpr));
}
addEventListener('resize', sizeCanvas);
sizeCanvas();

function drawRink(inp) {
  const W = cv.width, H = cv.height, pad = 4 * (W / cv.clientWidth || 1);
  const sx = (W - pad * 2) / (RINK.halfLength * 2), sz = (H - pad * 2) / (RINK.halfWidth * 2);
  const X = (x) => pad + (x + RINK.halfLength) * sx, Z = (z) => pad + (z + RINK.halfWidth) * sz;
  g.clearRect(0, 0, W, H);
  g.lineWidth = Math.max(1, W / 160);
  g.fillStyle = '#172034'; g.strokeStyle = '#34425F';
  g.beginPath(); g.roundRect(X(-30), Z(-13), 60 * sx, 26 * sz, RINK.cornerRadius * sx); g.fill(); g.stroke();
  const vline = (x, c) => { g.strokeStyle = c; g.beginPath(); g.moveTo(X(x), Z(-13)); g.lineTo(X(x), Z(13)); g.stroke(); };
  vline(0, 'rgba(255,75,62,.7)'); vline(-RINK.blueLineX, 'rgba(124,196,255,.6)'); vline(RINK.blueLineX, 'rgba(124,196,255,.6)');
  g.strokeStyle = 'rgba(255,75,62,.45)';
  g.beginPath(); g.arc(X(0), Z(0), RINK.centerCircleR * sx, 0, Math.PI * 2); g.stroke();
  // trail + dot
  const turbo = inp.b & BTN.TURBO;
  g.strokeStyle = turbo ? 'rgba(124,196,255,.9)' : 'rgba(161,172,192,.7)';
  g.beginPath(); trail.forEach((p, i) => (i ? g.lineTo(X(p.x), Z(p.z)) : g.moveTo(X(p.x), Z(p.z)))); g.stroke();
  const rr = Math.max(4, W / 40);
  g.fillStyle = turbo ? '#7CC4FF' : (inp.b & BTN.SHOOT ? '#FF8A2A' : '#E8EDF5');
  g.strokeStyle = '#0A0F1C'; g.lineWidth = Math.max(1.5, W / 160);
  g.beginPath(); g.arc(X(dot.x), Z(dot.z), rr, 0, Math.PI * 2); g.fill(); g.stroke();
  // stick vector arrow from the dot
  if (inp.mx || inp.mz) {
    g.strokeStyle = '#F2C14E'; g.lineWidth = Math.max(2, W / 110);
    g.beginPath(); g.moveTo(X(dot.x), Z(dot.z)); g.lineTo(X(dot.x + inp.mx * 8), Z(dot.z + inp.mz * 8)); g.stroke();
  }
}

const sign = (v) => (v < 0 ? '-' : '+') + Math.abs(v).toFixed(3);
let last = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  const inp = tc.poll();
  // fake "game": the dot skates, turbo is faster; SIM charge rises while SHOOT is held with the puck
  const spd = inp.b & BTN.TURBO ? 14 : 8;
  dot.x = clamp(dot.x + inp.mx * spd * dt, -RINK.halfLength + 1, RINK.halfLength - 1);
  dot.z = clamp(dot.z + inp.mz * spd * dt, -RINK.halfWidth + 1, RINK.halfWidth - 1);
  trail.push({ x: dot.x, z: dot.z }); if (trail.length > 40) trail.shift();
  if ($('simCharge').checked) {
    charge = hasPuck && (inp.b & BTN.SHOOT) ? Math.min(1, charge + dt / 1.1) : 0;
    tc.setCharge(charge);
    $('charge').value = String(charge);
  }
  drawRink(inp);
  const mag = Math.hypot(inp.mx, inp.mz);
  $('out').textContent =
    `mx ${sign(inp.mx)}  mz ${sign(inp.mz)}\n` +
    `|v| ${mag.toFixed(3)}  b ${inp.b.toString(2).padStart(4, '0')} (${inp.b})\n` +
    `ctx ${hasPuck ? 'puck' : 'defence'}  charge ${charge.toFixed(2)}\n` +
    `dot ${dot.x.toFixed(1)}, ${dot.z.toFixed(1)}`;
  $('vp').textContent = `test page · ${innerWidth}×${innerHeight}`;
  for (const el of document.querySelectorAll('.bit')) el.classList.toggle('on', !!(inp.b & +el.dataset.bit));
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- ?demo=1|2 : synthetic multi-touch so a headless screenshot shows the active state ----
function fire(target, type, id, x, y) {
  target.dispatchEvent(new PointerEvent(type, {
    pointerId: id, pointerType: 'touch', clientX: x, clientY: y, isPrimary: id === 11,
    bubbles: true, cancelable: true, button: type === 'pointermove' ? -1 : 0, buttons: 1,
  }));
}
if (demo && visible) {
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const root = tc.el;
    const zone = root.querySelector('.ir-touch-stickzone');
    const bz = root.querySelector('.ir-touch-btnzone');
    const ring = root.querySelector('.ir-touch-stick').getBoundingClientRect();
    const r = ring.width / 2, cx = ring.left + r, cy = ring.top + r;
    fire(zone, 'pointerdown', 11, cx + 6, cy - 10);
    const [ax, ay] = demo === 2 ? [r * 1.6, -r * 0.2] : [r * 0.62, -r * 0.48];
    fire(zone, 'pointermove', 11, cx + 6 + ax, cy - 10 + ay);
    const press = (sel, id) => {
      const t = root.querySelector(sel).getBoundingClientRect();
      fire(bz, 'pointerdown', id, t.left + t.width / 2 + 4, t.top + t.height / 2 + 3);
    };
    // demo=1: puck, Shoot held + charging; 2: auto turbo + Deke; 3: no puck, Pass + Turbo held
    if (demo === 3) { press('.ir-touch-b-pass', 12); press('.ir-touch-b-turbo', 13); }
    else press(demo === 2 ? '.ir-touch-b-deke' : '.ir-touch-b-shoot', 12);
    if (demo === 1) { $('simCharge').checked = false; charge = 0.62; tc.setCharge(charge); $('charge').value = '0.62'; }
  }));
}
</script>
</body>
</html>
