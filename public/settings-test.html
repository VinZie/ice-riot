<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ICE RIOT - settings test</title>
<link rel="icon" href="data:,">
<style>
  /* No style.css on purpose: the sheet must look right from its own token fallbacks. */
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #0A0F1C; color: #E8EDF5;
    font: 13px/18px Bahnschrift, "DIN Alternate", "Segoe UI", sans-serif;
  }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; height: 100vh; }
  .stage { position: relative; overflow: hidden; min-height: 0; background: #0A0F1C; }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .stage-msg {
    position: absolute; left: 32px; top: 28px; z-index: 1; pointer-events: none; color: #A1ACC0;
  }
  .stage-msg b { display: block; font-size: 22px; line-height: 1.2; color: #E8EDF5; margin-bottom: 4px; }
  kbd {
    font: inherit; font-size: 11px; padding: 1px 5px; border-radius: 4px; background: #1E2940; color: #A1ACC0;
  }
  aside {
    display: flex; flex-direction: column; gap: 12px; min-height: 0; padding: 20px;
    background: #111829; box-shadow: inset 1px 0 0 #253049;
  }
  aside h2 { margin: 0; font-size: 13px; line-height: 1.23; font-weight: 600; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; }
  .tools button {
    font: inherit; height: 32px; padding: 0 12px; cursor: pointer; border-radius: 10px;
    color: #E8EDF5; background: transparent; border: 1px solid #34425F;
  }
  .tools button:hover { background: #172034; }
  .tools button:focus-visible { outline: 2px solid #E8EDF5; outline-offset: 2px; }
  pre {
    flex: 1 1 auto; min-height: 0; overflow: auto; margin: 0; padding: 10px; background: #0A0F1C;
    border: 1px solid #253049; border-radius: 10px; font: 12px/1.45 "Cascadia Mono", ui-monospace, Consolas, monospace; color: #A1ACC0;
  }
  pre mark { background: #1E2940; color: #E8EDF5; }
  .probe { padding: 8px 10px; background: #0A0F1C; border: 1px solid #253049; border-radius: 10px; font-size: 12px; color: #A1ACC0; }
  .probe b { color: #E8EDF5; font-weight: 600; }
  .lights { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .lights span { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 6px; background: #172034; color: #6A7590; }
  .lights span::before { content: ''; width: 7px; height: 7px; border-radius: 50%; border: 1px solid currentColor; }
  .lights span.on { color: #E8EDF5; background: #1E2940; }
  .lights span.on::before { background: #3FD98A; border-color: #3FD98A; }
  #log { margin: 0; padding: 0 0 0 18px; max-height: 120px; overflow: auto; font: 11px/1.4 "Cascadia Mono", Consolas, monospace; color: #A1ACC0; }
  #selftest { white-space: pre-wrap; font: 11px/1.4 "Cascadia Mono", Consolas, monospace; max-height: 40vh; overflow: auto; }
  #selftest .ok { color: #3FD98A; } #selftest .bad { color: #FF4B3E; }
  @media (max-width: 760px) {
    .layout { display: block; height: auto; }
    .stage { height: 100vh; height: 100svh; }
    aside { box-shadow: inset 0 1px 0 #253049; }
    pre { max-height: 60vh; }
  }
</style>
</head>
<body>
<div class="layout">
  <main class="stage" id="stage">
    <canvas id="game" aria-label="Fake rink"></canvas>
    <div class="stage-msg"><b>Settings sheet test</b>Press <kbd>O</kbd> to open. With the sheet closed, clicks and keys on the rink drive the input probe.</div>
  </main>
  <aside>
    <h2>Settings test</h2>
    <div class="tools">
      <button type="button" id="btn-open">Open</button>
      <button type="button" id="btn-controls">Open controls</button>
      <button type="button" id="btn-reset">store.reset()</button>
      <button type="button" id="btn-clear">Clear storage and reload</button>
    </div>
    <div class="probe" id="probe">keyFor(): press a key or click the rink while the sheet is closed</div>
    <div class="probe" id="input-probe">input.js poll()<div class="lights" id="lights"></div></div>
    <h2>Live settings</h2>
    <pre id="json"></pre>
    <h2>subscribe() log</h2>
    <ol id="log"></ol>
    <div id="selftest" hidden></div>
  </aside>
</div>
<script type="module">
import { createSettings, createSettingsPanel, DEFAULTS, keyLabel, STORAGE_KEY, MOUSE_CODES } from './settings.js';
import { createInput } from './input.js';
import { BTN } from '/shared/constants.js';

// URL params:
//   ?key=<storageKey>  &tab=audio|video|controls|gameplay  &open=0  &full=1 (sheet over the whole page)
//   &capture=<action>:<slot>         leave a slot capturing (e.g. pass:0)
//   &rebind=<action>:<slot>:<code>   apply one rebind through the UI (code may be Mouse0..Mouse2)
//   &name=<player name>  &armed=1 (arm "Reset all")  &selftest=1
const params = new URLSearchParams(location.search);
const storageKey = params.get('key') || STORAGE_KEY;
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

drawRink();
if (params.get('selftest') === '1') await selfTest();

const settings = createSettings({ storageKey });
if (params.has('name')) settings.set('name', params.get('name'));
const panel = createSettingsPanel(params.get('full') === '1' ? document.body : $('stage'), settings);
window.irSettings = settings;
window.irPanel = panel;

// live input probe: the rink canvas is a game surface while the sheet is closed
const input = createInput();
input.setKeymap((code) => settings.keyFor(code));
const LIGHTS = [['Shoot', BTN.SHOOT], ['Pass', BTN.PASS], ['Deke', BTN.ACTION], ['Turbo', BTN.TURBO]];
$('lights').innerHTML = LIGHTS.map(([n]) => `<span data-l="${n}">${n}</span>`).join('') + '<span data-l="move">Skate</span>';
(function tick() {
  input.setGameActive(!panel.isOpen());
  input.setSuppressed(panel.isOpen());
  const st = input.poll();
  for (const [n, bit] of LIGHTS) document.querySelector(`[data-l="${n}"]`).classList.toggle('on', !!(st.b & bit));
  const mv = document.querySelector('[data-l="move"]');
  mv.classList.toggle('on', !!(st.mx || st.mz));
  mv.textContent = st.mx || st.mz ? `Skate ${st.mx.toFixed(1)}, ${st.mz.toFixed(1)}` : 'Skate';
  requestAnimationFrame(tick);
})();

let lastKey = null;
function renderJson() {
  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const txt = JSON.stringify(settings.all(), null, 2).replace(/\[\s+([^[\]]*?)\s+\]/g, (m, inner) => `[${inner.replace(/\s*\n\s*/g, ' ')}]`);
  $('json').innerHTML = esc(txt).split('\n').map((line) =>
    lastKey && line.startsWith(`  "${lastKey}"`) ? `<mark>${line}</mark>` : line).join('\n');
}
settings.subscribe((key, value) => {
  lastKey = key;
  renderJson();
  const li = document.createElement('li');
  li.textContent = `${key} = ${JSON.stringify(value)}`;
  $('log').prepend(li);
  while ($('log').children.length > 12) $('log').lastChild.remove();
});
renderJson();

function probe(code) {
  const a = settings.keyFor(code);
  $('probe').innerHTML = `keyFor(<b>${code || '?'}</b>) = <b>${a === null ? 'null' : `'${a}'`}</b> &middot; ${keyLabel(code)}`;
}
window.addEventListener('keydown', (e) => {
  if (panel.isOpen()) return;
  if (e.code === 'KeyO' && !e.repeat) { e.preventDefault(); panel.open(); return; }
  probe(e.code);
});
$('game').addEventListener('mousedown', (e) => { if (!panel.isOpen() && MOUSE_CODES[e.button]) probe(MOUSE_CODES[e.button]); });
$('btn-open').addEventListener('click', () => panel.open());
$('btn-controls').addEventListener('click', () => panel.open('controls'));
$('btn-reset').addEventListener('click', () => settings.reset());
$('btn-clear').addEventListener('click', () => {
  try { localStorage.removeItem(storageKey); } catch { /* blocked */ }
  location.reload();
});

if (params.get('open') !== '0') {
  panel.open(params.get('tab') || undefined);
  const slotEl = (a, s) => document.querySelector(`.ir-set-key[data-action="${a}"][data-slot="${s}"]`);
  const rebind = params.get('rebind');
  if (rebind) {
    const [a, s, code] = rebind.split(':');
    slotEl(a, s)?.click();
    const m = /^Mouse(\d)$/.exec(code || '');
    if (m) {
      for (const type of ['mousedown', 'mouseup']) document.body.dispatchEvent(new MouseEvent(type, { button: Number(m[1]), bubbles: true, cancelable: true }));
    } else {
      window.dispatchEvent(new KeyboardEvent('keydown', { code, bubbles: true, cancelable: true }));
    }
  }
  const cap = params.get('capture');
  if (cap) {
    const [a, s] = cap.split(':');
    slotEl(a, s)?.click();
  }
  if (params.get('armed') === '1') document.querySelector('[data-act="reset-all"]')?.click();
}

function drawRink() {
  const cv = $('game');
  const paint = () => {
    const w = cv.clientWidth, h = cv.clientHeight;
    cv.width = w; cv.height = h;
    const g = cv.getContext('2d');
    g.fillStyle = '#0A0F1C'; g.fillRect(0, 0, w, h);
    const rw = Math.min(w - 80, (h - 80) * 2), rh = rw / 2, x = (w - rw) / 2, y = (h - rh) / 2 + 20;
    g.fillStyle = '#DCEAF6'; g.globalAlpha = 0.12;
    g.beginPath(); g.roundRect(x, y, rw, rh, rh * 0.28); g.fill();
    g.globalAlpha = 0.5; g.lineWidth = 2;
    g.strokeStyle = '#FF4B3E'; g.beginPath(); g.moveTo(w / 2, y); g.lineTo(w / 2, y + rh); g.stroke();
    g.strokeStyle = '#7CC4FF'; for (const f of [0.35, 0.65]) { g.beginPath(); g.moveTo(x + rw * f, y); g.lineTo(x + rw * f, y + rh); g.stroke(); }
    g.globalAlpha = 1;
  };
  paint();
  addEventListener('resize', paint);
}

// ---------------------------------------------------------------------------------------------
// In-browser checks (drive the real DOM). Results go to #selftest and document.title so a
// headless run can read them.
async function selfTest() {
  const out = $('selftest');
  out.hidden = false;
  const results = [];
  const check = (name, cond) => results.push([name, !!cond]);
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;left:0;top:0;width:800px;height:600px;';
  document.body.append(box);
  const store = createSettings({ storage: null });
  const p = createSettingsPanel(box, store);
  const q = (sel) => box.querySelector(sel);
  const key = (code, target = document.activeElement || window, type = 'keydown') => {
    const ev = new KeyboardEvent(type, { code, key: code, bubbles: true, cancelable: true });
    target.dispatchEvent(ev);
    return ev;
  };
  const mouse = (type, button, target) => {
    const ev = new MouseEvent(type, { button, bubbles: true, cancelable: true });
    target.dispatchEvent(ev);
    return ev;
  };
  let gameSaw = [];
  const gameListener = (e) => gameSaw.push(e.code);
  window.addEventListener('keydown', gameListener);
  const events = [];
  box.addEventListener('ir-settings', (e) => events.push(e.detail.open));

  check('style injected once', document.querySelectorAll('#ir-set-style').length === 1);
  check('starts closed', !p.isOpen() && q('.ir-set-overlay').hidden);
  p.open();
  check('open() opens', p.isOpen() && !q('.ir-set-overlay').hidden && q('.ir-set-overlay').classList.contains('is-open'));
  check('focus moved into the sheet', q('.ir-set-dialog').contains(document.activeElement));
  check('ir-settings open event', events[0] === true);
  check('four tabs', box.querySelectorAll('[role=tab]').length === 4);
  check('header: Settings, Esc chip, close button', q('.ir-set-title').textContent === 'Settings' && q('.ir-set-esc').textContent === 'Esc' && !!q('.ir-set-x svg'));
  await sleep(600);
  const r = q('.ir-set-dialog').getBoundingClientRect();
  check(`sheet is 600px wide at the right edge, full height (${Math.round(r.left)},${Math.round(r.top)} ${Math.round(r.width)}x${Math.round(r.height)})`,
    Math.round(r.width) === 600 && Math.round(r.right) === 800 && Math.round(r.height) === 600);
  check('no native select anywhere', !box.querySelector('select'));

  // audio
  const sfx = q('[data-key="sfxVolume"] input');
  sfx.value = '33'; sfx.dispatchEvent(new Event('input', { bubbles: true }));
  check('slider writes settings', store.get('sfxVolume') === 0.33);
  check('slider value label updates', q('[data-key="sfxVolume"] output').textContent === '33%');
  store.set('musicVolume', 0.12);
  check('external set() syncs slider', q('[data-key="musicVolume"] input').value === '12');
  const ann = q('[data-key="announcerVolume"] input');
  check('announcer slider shows 90%', ann && ann.value === '90' && q('[data-key="announcerVolume"] output').textContent === '90%');
  ann.value = '50'; ann.dispatchEvent(new Event('input', { bubbles: true }));
  check('announcer slider writes announcerVolume', store.get('announcerVolume') === 0.5);
  const mute = q('[data-key="muted"] [role="switch"]');
  mute.click();
  check('mute switch toggles', store.get('muted') === true && mute.getAttribute('aria-checked') === 'true');
  check('muted dims the volume rows', ['sfxVolume', 'musicVolume', 'announcerVolume'].every((k) => q(`[data-key="${k}"]`).classList.contains('is-dim')));
  q('[data-key="muted"] label').click();
  check('clicking the label toggles too', store.get('muted') === false);
  key('KeyM', q('[data-tab="audio"]'));
  check('M toggles mute while the sheet is open', store.get('muted') === true);
  key('KeyM', q('[data-tab="audio"]'));
  check('M toggles it back', store.get('muted') === false);
  check('M did not reach the game', !gameSaw.includes('KeyM'));

  // video
  q('[data-tab="video"]').click();
  check('video tab shown', !q('[data-pane="video"]').hidden && q('[data-pane="audio"]').hidden);
  q('[data-key="quality"] [data-value="low"]').click();
  check('quality segmented control', store.get('quality') === 'low' && q('[data-key="quality"] [data-value="low"]').getAttribute('aria-checked') === 'true');
  key('ArrowLeft', q('[data-key="quality"] [data-value="low"]'));
  check('arrow keys move the quality selection', store.get('quality') === 'medium' && document.activeElement === q('[data-key="quality"] [data-value="medium"]'));
  q('[data-key="reduceFlashes"] [role="switch"]').click();
  check('reduce flashes -> calm class', store.get('reduceFlashes') && q('.ir-set-overlay').classList.contains('ir-set-calm'));
  q('[data-key="showNames"] [role="switch"]').click();
  check('name tags toggle', store.get('showNames') === false);
  check('camera shake slider at 100%', q('[data-key="cameraShake"] output').textContent === '100%');

  // tab keyboard nav
  q('[data-tab="video"]').focus();
  key('ArrowRight', q('[data-tab="video"]'));
  check('ArrowRight moves to the controls tab', !q('[data-pane="controls"]').hidden && document.activeElement === q('[data-tab="controls"]'));

  // controls: layout
  const slot = (a, s) => q(`.ir-set-key[data-action="${a}"][data-slot="${s}"]`);
  const msg = () => q('.ir-set-status-msg').textContent;
  const tone = () => q('.ir-set-status').dataset.tone;
  check('skate row: W A S D then arrows', [...q('[data-row="skate"]').querySelectorAll('.ir-set-key')].map((b) => b.textContent).join(' ') === 'W A S D ↑ ← ↓ →');
  check('shoot: Left click / Space', slot('shoot', 0).textContent === 'Left click' && slot('shoot', 1).textContent === 'Space');
  check('pass: Right click / K', slot('pass', 0).textContent === 'Right click' && slot('pass', 1).textContent === 'K');
  check('deke: L / empty', slot('action', 0).textContent === 'L' && slot('action', 1).classList.contains('is-empty'));
  check('turbo: L-Shift / R-Shift', slot('turbo', 0).textContent === 'L-Shift' && slot('turbo', 1).textContent === 'R-Shift');
  check('gamepad list has six fixed entries', box.querySelectorAll('.ir-set-pad li').length === 6);
  check('status row idle', tone() === 'idle');

  // rebinding with keys
  slot('shoot', 0).click();
  check('slot enters capture', slot('shoot', 0).classList.contains('is-capturing') && slot('shoot', 0).textContent === 'Press a key or click');
  check('status asks for a key or click', msg() === 'Press a key or click for shoot · check' && q('.ir-set-status-aside').textContent === 'Esc cancels · Backspace clears' && tone() === 'capture');
  gameSaw = [];
  let ev = key('KeyJ', slot('shoot', 0));
  check('captured key bound', store.get('keys').shoot[0] === 'KeyJ' && slot('shoot', 0).textContent === 'J');
  check('capture swallowed the key (game never saw it)', gameSaw.length === 0 && ev.defaultPrevented);
  check('status: bound, with a check glyph', /^Bound J to shoot/.test(msg()) && tone() === 'ok' && !!q('.ir-set-status .ir-set-ico svg'));
  key('KeyJ', window, 'keyup');
  slot('shoot', 0).click();
  key('KeyK', slot('shoot', 0));
  check('conflict swaps', store.get('keys').shoot[0] === 'KeyK' && store.get('keys').pass[1] === 'KeyJ');
  check('status says what moved', msg() === 'Bound K to shoot · check and moved J to pass · switch');
  check('keyFor follows', store.keyFor('KeyK') === 'shoot' && store.keyFor('KeyJ') === 'pass');
  key('KeyK', window, 'keyup');

  // rebinding with the mouse
  slot('pass', 1).click();
  check('the click that starts capture binds nothing', store.get('keys').pass[1] === 'KeyJ' && slot('pass', 1).classList.contains('is-capturing'));
  const md = mouse('mousedown', 1, q('.ir-set-body'));
  check('middle click binds Mouse1', store.get('keys').pass[1] === 'Mouse1' && md.defaultPrevented);
  check('slot reads Middle click', slot('pass', 1).textContent === 'Middle click');
  mouse('mouseup', 1, q('.ir-set-body'));
  check('the binding auxclick is eaten', mouse('auxclick', 1, q('.ir-set-body')).defaultPrevented);
  mouse('mousedown', 0, document.body); mouse('mouseup', 0, document.body);   // the user's next real click
  slot('turbo', 1).click();
  const cm = new MouseEvent('contextmenu', { button: 2, bubbles: true, cancelable: true });
  slot('turbo', 1).dispatchEvent(cm);
  check('no context menu while capturing', cm.defaultPrevented && p.isOpen());
  const done = q('[data-act="done"]');
  mouse('mousedown', 2, done);
  check('right click binds Mouse2, swapped off pass', store.get('keys').turbo[1] === 'Mouse2' && store.get('keys').pass[0] === 'ShiftRight');
  mouse('mouseup', 2, done);
  const cm2 = new MouseEvent('contextmenu', { button: 2, bubbles: true, cancelable: true });
  done.dispatchEvent(cm2);
  check('context menu after the binding right click is blocked', cm2.defaultPrevented);
  done.click();
  check('click after a binding mousedown does not press Done', p.isOpen());
  mouse('mousedown', 0, document.body); mouse('mouseup', 0, document.body);   // an ordinary click ends the eat window
  slot('up', 1).click();
  mouse('mousedown', 0, q('.ir-set-body'));
  check('skate slot shows a mouse glyph for left click', store.get('keys').up[1] === 'Mouse0' && !!slot('up', 1).querySelector('svg') && /Left click/.test(slot('up', 1).getAttribute('aria-label')));
  mouse('mouseup', 0, q('.ir-set-body'));
  mouse('mousedown', 0, document.body); mouse('mouseup', 0, document.body);

  // cancel / clear / unbound
  slot('turbo', 1).click();
  key('Escape', slot('turbo', 1));
  check('Esc cancels capture, sheet stays open', p.isOpen() && !slot('turbo', 1).classList.contains('is-capturing') && store.get('keys').turbo[1] === 'Mouse2');
  check('cancel message', msg() === 'Rebind cancelled');
  slot('turbo', 1).click();
  key('Backspace', slot('turbo', 1));
  check('Backspace clears the slot', store.get('keys').turbo.length === 1 && slot('turbo', 1).classList.contains('is-empty') && slot('turbo', 1).textContent === '—');
  check('clear message', msg() === 'Cleared right click from turbo');
  slot('turbo', 1).click();
  key('KeyL', slot('turbo', 1));
  check('stealing the only key leaves the action unbound and flagged',
    store.get('keys').action.length === 0 && q('[data-row="action"] .ir-set-keyname').classList.contains('is-unbound')
    && tone() === 'warn' && /Deke · poke has no key now$/.test(msg()));
  check('unbound row shows a glyph and a word', getComputedStyle(q('[data-row="action"] .ir-set-keyname-w')).display !== 'none' && /Not bound/.test(q('[data-row="action"] .ir-set-keyname-w').textContent));
  slot('down', 0).click();
  key('Backspace', slot('down', 0));
  slot('down', 0).click();
  key('Backspace', slot('down', 0));
  check('skate shows which direction is unbound', /Not bound: down/.test(q('[data-row="skate"] .ir-set-keyname-w').textContent) && q('[data-row="skate"] .ir-set-keyname').classList.contains('is-unbound'));

  // clicks are eaten while capturing; game keys blocked while open
  slot('shoot', 1).click();
  q('[data-tab="gameplay"]').click();
  check('clicks are eaten while capturing', !q('[data-pane="controls"]').hidden);
  key('Escape', slot('shoot', 1));
  gameSaw = [];
  key('KeyW', q('[data-tab="controls"]'));
  check('the sheet blocks game keys while open', gameSaw.length === 0);

  // gameplay: tutorial + name
  q('[data-tab="gameplay"]').click();
  check('gameplay tab shown', !q('[data-pane="gameplay"]').hidden);
  q('[data-key="showTutorial"] [role="switch"]').click();
  check('tutorial hints toggle', store.get('showTutorial') === false);
  const name = q('[data-key="name"] input');
  name.focus(); name.value = ' Big  Al '; name.dispatchEvent(new Event('input', { bubbles: true }));
  check('name sanitized into store', store.get('name') === 'Big Al');
  check('typing not rewritten while focused', name.value === ' Big  Al ');
  check('counter counts', q('[data-key="name"] .ir-set-count').textContent === '9/16');
  key('KeyM', name);
  check('M in the name field types instead of muting', store.get('muted') === false);
  name.dispatchEvent(new Event('change', { bubbles: true }));
  check('name normalized on change', name.value === 'Big Al' && q('[data-key="name"] .ir-set-count').textContent === '6/16');

  // reset all (two-step)
  const resetBtn = q('[data-act="reset-all"]');
  resetBtn.click();
  check('reset all arms first', store.get('quality') === 'medium' && resetBtn.textContent === 'Confirm reset' && resetBtn.classList.contains('is-armed'));
  check('armed note: your name is kept', q('.ir-set-foot-note').textContent === 'Your name is kept');
  resetBtn.click();
  check('reset all restores defaults but keeps the name', store.get('quality') === 'auto' && store.get('muted') === false && store.get('name') === 'Big Al'
    && JSON.stringify(store.get('keys')) === JSON.stringify(DEFAULTS.keys) && store.get('showTutorial') === true);
  check('reset confirmation with a glyph', /Settings reset/.test(q('.ir-set-foot-note').textContent) && !!q('.ir-set-foot-note svg') && resetBtn.textContent === 'Reset all');
  resetBtn.click();
  await sleep(3700);
  check('disarms after 3.5 s', resetBtn.textContent === 'Reset all' && !resetBtn.classList.contains('is-armed') && store.get('quality') === 'auto');

  // open(tab), Esc, Done, scrim
  p.open('audio');
  check('open(tab) while open switches tab', !q('[data-pane="audio"]').hidden);
  key('Escape', q('[data-tab="audio"]'));
  check('Esc closes', !p.isOpen());
  check('ir-settings close event', events[events.length - 1] === false);
  await sleep(220);
  check('hidden after the exit motion', q('.ir-set-overlay').hidden);
  p.open();
  check('re-open remembers the tab', !q('[data-pane="audio"]').hidden);
  p.close();
  p.open('controls');
  check('open(tab) picks the tab', !q('[data-pane="controls"]').hidden);
  q('[data-act="done"]').click();
  check('Done closes', !p.isOpen());
  p.open('gameplay');
  q('.ir-set-scrim').click();
  check('clicking the scrim closes', !p.isOpen());
  await sleep(220);

  p.dispose();
  check('dispose removes the overlay', !box.querySelector('.ir-set-overlay'));
  check('dispose removes the style', !document.getElementById('ir-set-style'));
  store.set('sfxVolume', 0.5);   // must not throw after dispose
  window.removeEventListener('keydown', gameListener);
  box.remove();

  // ------------------------------------------------------------------ input.js: mouse buttons
  const keys = createSettings({ storage: null });
  const inp = createInput();
  inp.setKeymap((c) => keys.keyFor(c));
  inp.setGameActive(true);
  const cv = $('game');
  const has = (bit) => !!(inp.poll().b & bit);
  mouse('mousedown', 0, cv);
  check('input: left click on the canvas = shoot', has(BTN.SHOOT));
  check('input: held while the button is down', has(BTN.SHOOT));
  mouse('mouseup', 0, document.body);
  check('input: released by a mouseup anywhere', !has(BTN.SHOOT));
  mouse('mousedown', 2, cv); mouse('mouseup', 2, cv);
  check('input: a quick right click is latched as pass', has(BTN.PASS));
  check('input: and then released', !has(BTN.PASS));
  const cmGame = new MouseEvent('contextmenu', { button: 2, bubbles: true, cancelable: true });
  cv.dispatchEvent(cmGame);
  check('input: no context menu over the game', cmGame.defaultPrevented);
  const mid = mouse('mousedown', 1, cv);
  check('input: unbound middle click does nothing', !inp.poll().b && !mid.defaultPrevented);
  mouse('mouseup', 1, cv);
  const ui = document.createElement('div');
  ui.id = 'ui';
  ui.innerHTML = '<div class="menu"><span>menu</span></div><button type="button">b</button><div data-act="x">x</div>';
  document.body.append(ui);
  mouse('mousedown', 0, ui); mouse('mouseup', 0, ui);
  check('input: the bare #ui overlay counts as the game', has(BTN.SHOOT));
  for (const el of [ui.querySelector('.menu span'), ui.querySelector('button'), ui.querySelector('[data-act]'), document.body]) {
    const e2 = mouse('mousedown', 0, el); mouse('mouseup', 0, el);
    check(`input: ignores clicks on ${el.tagName.toLowerCase()}${el.className ? '.' + el.className : ''}`, !has(BTN.SHOOT) && !e2.defaultPrevented);
  }
  const cmUi = new MouseEvent('contextmenu', { button: 2, bubbles: true, cancelable: true });
  ui.querySelector('button').dispatchEvent(cmUi);
  check('input: context menu still works on UI', !cmUi.defaultPrevented);
  ui.remove();
  inp.setGameActive(false);
  mouse('mousedown', 0, cv); mouse('mouseup', 0, cv);
  const cmOff = new MouseEvent('contextmenu', { button: 2, bubbles: true, cancelable: true });
  cv.dispatchEvent(cmOff);
  check('input: nothing while no game is active', !has(BTN.SHOOT) && !cmOff.defaultPrevented);
  inp.setGameActive(true);
  inp.setSuppressed(true);
  mouse('mousedown', 0, cv); mouse('mouseup', 0, cv);
  check('input: nothing while suppressed', !has(BTN.SHOOT));
  inp.setSuppressed(false);
  key('Space', cv);
  check('input: keyboard unchanged (Space = shoot)', has(BTN.SHOOT));
  key('Space', cv, 'keyup');
  key('KeyJ', cv);
  check('input: J is no longer a default', !inp.poll().b);
  key('KeyJ', cv, 'keyup');
  mouse('mousedown', 0, cv);
  inp.poll();
  cv.dispatchEvent(new MouseEvent('mousemove', { buttons: 0, bubbles: true }));
  check('input: a release outside the window is noticed on mousemove', !has(BTN.SHOOT));
  mouse('mousedown', 0, cv);
  window.dispatchEvent(new Event('blur'));
  check('input: blur releases and drops the latch', !has(BTN.SHOOT));
  keys.set('keys', { action: ['Mouse1'] });
  mouse('mousedown', 1, cv); mouse('mouseup', 1, cv);
  check('input: rebound middle click = deke', has(BTN.ACTION));
  cv.dispatchEvent(new PointerEvent('pointerdown', { pointerType: 'touch', bubbles: true }));
  mouse('mousedown', 0, cv); mouse('mouseup', 0, cv);
  check('input: mouse events that follow a touch are ignored', !has(BTN.SHOOT));
  inp.dispose();

  const bad = results.filter((x) => !x[1]);
  out.innerHTML = results.map(([n, ok]) => `<div class="${ok ? 'ok' : 'bad'}">${ok ? 'PASS' : 'FAIL'} ${n}</div>`).join('');
  document.title = `SELFTEST ${bad.length ? 'FAIL' : 'PASS'} ${results.length - bad.length}/${results.length}` +
    (bad.length ? ` :: ${bad.map((b) => b[0]).join(' | ')}` : '');
}
</script>
</body>
</html>
